<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seguimiento de Equipo | SGOL-IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .tracking-card { width: 100%; max-width: 420px; }
        .brand { 
            font-weight: 800; 
            font-size: 2.8rem; 
            margin-bottom: 0.5rem; 
            text-align: center; 
            background: var(--grad-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.25);
        }
    </style>
</head>
<body>
    <div class="tracking-card">
        <div class="text-center mb-4">
            <div class="brand">SGOL-IT</div>
            <p class="text-muted small">Portal de Autogestión para Clientes</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} shadow-sm text-center fw-bold">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="card glass-panel p-4">
            <form action="/tracking" method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">DNI / CUIL</label>
                    <input type="text" name="dni" class="form-control" placeholder="Ingrese su DNI" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">Contraseña Web</label>
                    <input type="password" name="password_web" class="form-control" placeholder="Entregada en recepción" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold text-black">INGRESAR A MI PORTAL</button>
            </form>
        </div>
        <div class="text-center mt-4">
            <a href="/" class="btn btn-outline-primary btn-sm fw-bold">Soy personal del laboratorio (Acceso Interno)</a>
        </div>
    </div>
</body>
</html>
