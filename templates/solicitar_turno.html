<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Turno | SGOL-IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container py-5">
        <h2 class="fw-bold mb-4 text-center text-white">Solicitar Turno y Cotizacion</h2>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card glass-panel p-4">
                    <form action="/solicitar_turno" method="POST">
                        <h5 class="fw-bold text-info mb-3">1. Diagnóstico Preliminar</h5>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Seleccione el síntoma o servicio</label>
                            <select name="servicio" id="servicio" class="form-select" required>
                                <option value="" data-precio="0" selected disabled>Seleccione una opción...</option>
                                <option value="Limpieza y Mantenimiento" data-precio="15000">Limpieza Física y Cambio de Pasta Térmica</option>
                                <option value="Formateo e Instalación OS" data-precio="20000">Formateo e Instalación de Windows</option>
                                <option value="No enciende" data-precio="5000">El equipo no enciende (Revisión técnica)</option>
                                <option value="Lentitud extrema" data-precio="25000">Lentitud extrema (Revisión + Optimizacion)</option>
                                <option value="Otro" data-precio="0">Otro problema (A cotizar en local)</option>
                            </select>
                        </div>
                        <div class="alert bg-secondary text-white border-0 text-center mb-4 p-3">
                            <span class="fs-5">Presupuesto Estimado: </span>
                            <span class="fs-3 fw-bold" id="precio_display" style="color: var(--accent-emerald);">$0.00</span>
                            <input type="hidden" name="presupuesto_estimado" id="presupuesto_estimado" value="0">
                        </div>

                        <!-- Tiempo Estimado de Entrega -->
                        <div id="tiempo_estimado_container" class="alert bg-dark text-white border-0 text-center mb-4 p-3" style="border: 1px solid var(--border-glass) !important; display: none; border-radius: 10px;">
                            <span class="fs-5">Tiempo Estimado de Entrega: </span>
                            <span class="fs-4 fw-bold" id="tiempo_estimado_display">-</span>
                        </div>

                        <h5 class="fw-bold text-info mb-3">2. Datos Personales</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small">DNI / CUIL</label>
                                <input type="text" name="dni" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Nombre Completo</label>
                                <input type="text" name="nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Teléfono</label>
                                <input type="text" name="telefono" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label text-muted small fw-bold">¿Posee garantía para su equipo?</label>
                                <select name="garantia" id="garantia" class="form-select" required>
                                    <option value="" selected disabled>Seleccione una opción...</option>
                                    <option value="1">Sí, posee garantía</option>
                                    <option value="0">No posee garantía</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">CONFIRMAR TURNO</button>
                            <a href="/" class="btn btn-outline-danger w-100 mt-3 fw-bold">Volver al Inicio</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        function actualizarEstimacion() {
            var servicioSelect = document.getElementById('servicio');
            var garantiaSelect = document.getElementById('garantia');
            var precioDisplay = document.getElementById('precio_display');
            var presupuestoEstimadoInput = document.getElementById('presupuesto_estimado');
            
            var tiempoContainer = document.getElementById('tiempo_estimado_container');
            var tiempoDisplay = document.getElementById('tiempo_estimado_display');
            
            if (!servicioSelect || servicioSelect.selectedIndex <= 0) {
                if (tiempoContainer) tiempoContainer.style.display = 'none';
                return;
            }
            
            // Actualizar precio
            var optionSeleccionada = servicioSelect.options[servicioSelect.selectedIndex];
            var precio = optionSeleccionada.getAttribute('data-precio') || '0';
            if (precioDisplay) {
                precioDisplay.innerText = '$' + parseFloat(precio).toFixed(2);
            }
            if (presupuestoEstimadoInput) {
                presupuestoEstimadoInput.value = precio;
            }
            
            // Calcular tiempo estimado
            var servicioValue = servicioSelect.value;
            var garantiaValue = garantiaSelect ? garantiaSelect.value : '';
            
            var tiempoTexto = '';
            var tiempoColor = 'var(--accent-cyan)';
            
            if (garantiaValue === '1') {
                tiempoTexto = 'En el día o próximo día hábil en horario de tarde (14 a 19hs)';
                tiempoColor = 'var(--accent-emerald)';
            } else {
                if (servicioValue === 'Limpieza y Mantenimiento' || servicioValue === 'Formateo e Instalación OS') {
                    tiempoTexto = '2 a 4 días hábiles';
                } else if (servicioValue === 'Lentitud extrema') {
                    tiempoTexto = '3 a 5 días hábiles';
                } else if (servicioValue === 'No enciende') {
                    tiempoTexto = '5 a 10 días hábiles (diagnóstico complejo de hardware)';
                } else if (servicioValue === 'Otro') {
                    tiempoTexto = '5 a 10 días hábiles (sujeto a diagnóstico en local)';
                } else {
                    tiempoTexto = 'Sujeto a diagnóstico técnico';
                }
            }
            
            if (tiempoDisplay) {
                tiempoDisplay.innerText = tiempoTexto;
                tiempoDisplay.style.color = tiempoColor;
            }
            if (tiempoContainer) {
                tiempoContainer.style.display = 'block';
            }
        }
        
        document.getElementById('servicio').addEventListener('change', actualizarEstimacion);
        if (document.getElementById('garantia')) {
            document.getElementById('garantia').addEventListener('change', actualizarEstimacion);
        }
        
        // Ejecutar al cargar la página por si hay valores preseleccionados
        actualizarEstimacion();

        // Lógica de Autocompletado de Cliente
        document.querySelector('input[name="dni"]').addEventListener('blur', function() {
            var dni = this.value.trim();
            if(dni.length >= 7) {
                fetch('/api/cliente/' + dni)
                .then(response => response.json())
                .then(data => {
                    const nombre = document.querySelector('input[name="nombre"]');
                    const email = document.querySelector('input[name="email"]');
                    const telefono = document.querySelector('input[name="telefono"]');
                    
                    if(data.encontrado) {
                        nombre.value = data.nombre;
                        nombre.readOnly = true;
                        nombre.classList.add('bg-secondary', 'text-white', 'border-0');
                        
                        email.value = data.email;
                        email.readOnly = true;
                        email.classList.add('bg-secondary', 'text-white', 'border-0');
                        
                        telefono.value = data.telefono;
                        telefono.readOnly = true;
                        telefono.classList.add('bg-secondary', 'text-white', 'border-0');
                    } else {
                        nombre.readOnly = false;
                        nombre.classList.remove('bg-secondary', 'text-white', 'border-0');
                        email.readOnly = false;
                        email.classList.remove('bg-secondary', 'text-white', 'border-0');
                        telefono.readOnly = false;
                        telefono.classList.remove('bg-secondary', 'text-white', 'border-0');
                    }
                })
                .catch(err => console.error("Error al buscar cliente:", err));
            } else {
                const nombre = document.querySelector('input[name="nombre"]');
                const email = document.querySelector('input[name="email"]');
                const telefono = document.querySelector('input[name="telefono"]');
                
                if(nombre) {
                    nombre.readOnly = false;
                    nombre.classList.remove('bg-secondary', 'text-white', 'border-0');
                    email.readOnly = false;
                    email.classList.remove('bg-secondary', 'text-white', 'border-0');
                    telefono.readOnly = false;
                    telefono.classList.remove('bg-secondary', 'text-white', 'border-0');
                }
            }
        });
    </script>
</body>
</html>
