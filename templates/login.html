<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGOL-IT | Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 420px; }
        .brand { 
            font-weight: 800; 
            font-size: 2.8rem; 
            margin-bottom: 0.5rem; 
            text-align: center; 
            background: var(--grad-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.25);
        }
        .nav-pills .nav-link { color: var(--text-secondary); border: 1px solid rgba(255,255,255,0.05); margin: 0 4px; }
        .nav-pills .nav-link.active { background: var(--grad-primary); color: #000 !important; font-weight: 700; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); border-color: transparent; }
    </style>
</head>
<body>
    <div class="login-card glass-panel p-4">
        <div class="brand">SGOL-IT</div>
        <p class="text-center text-muted mb-4 small">Soporte Técnico & Gestión de Laboratorio</p>
        
        {% if error %}
            <div class="alert alert-danger py-2 text-center fw-bold">{{ error }}</div>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} shadow-sm text-center fw-bold py-2">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <ul class="nav nav-pills nav-justified mb-4" id="loginTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="empleado-tab" data-bs-toggle="pill" data-bs-target="#empleado" type="button" role="tab">👨‍🔧 Personal</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="cliente-tab" data-bs-toggle="pill" data-bs-target="#cliente" type="button" role="tab">👤 Cliente</button>
            </li>
        </ul>

        <div class="tab-content" id="loginTabsContent">
            
            <div class="tab-pane fade show active" id="empleado" role="tabpanel">
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Usuario</label>
                        <input type="text" class="form-control" name="usuario" placeholder="Ej: admin" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Contraseña</label>
                        <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">INGRESAR AL SISTEMA</button>
                </form>
            </div>

            <div class="tab-pane fade" id="cliente" role="tabpanel">
                <form action="/tracking" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">DNI / CUIL</label>
                        <input type="text" name="dni" class="form-control" placeholder="Ingrese su DNI sin puntos" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Contraseña Web</label>
                        <input type="password" name="password_web" class="form-control" placeholder="Entregada en recepción" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold mb-3">VER MI EQUIPO</button>
                    <hr>
                    <!-- Consulta rápida con Código de Tracking (RF-1.3) -->
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">¿Tienes un código de seguimiento?</label>
                        <div class="input-group">
                            <input type="text" id="tracking_code_input" class="form-control" placeholder="Ej: OT-X3D79F">
                            <button type="button" class="btn btn-primary fw-bold" onclick="var val = document.getElementById('tracking_code_input').value.trim(); if(val){ window.location.href='/seguimiento/' + val; } else { alert('Por favor, ingrese un código.'); }">Consultar</button>
                        </div>
                    </div>
                    <hr>
                    <a href="/solicitar_turno" class="btn btn-outline-primary w-100 fw-bold">Solicitar Nuevo Turno</a>
                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
